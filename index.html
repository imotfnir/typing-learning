<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文打字練習</title>
    <style>
        /* --- 基本樣式 --- */
        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            width: 800px;
            max-width: 90%;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* --- 統計數據區 --- */
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            font-size: 1.2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.9rem;
            color: #666;
        }

        .stat-item .value {
            font-size: 2rem;
            font-weight: bold;
            color: #1a73e8;
        }

        /* --- 文本顯示區 --- */
        #text-display {
            font-size: 1.8rem;
            letter-spacing: 4px;
            line-height: 1.8;
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
            text-align: justify;
        }

        /* --- 字元樣式 --- */
        #text-display span {
            transition: all 0.1s ease;
        }

        .correct {
            color: #34a853; /* 綠色 */
        }

        .incorrect {
            color: #ea4335; /* 紅色 */
            background-color: #fce8e6;
            border-radius: 3px;
        }

        .current {
            background-color: #d2e3fc;
            border-radius: 3px;
        }
        
        /* --- 輸入區 --- */
        #user-input {
            width: 100%;
            height: 100px;
            font-size: 1.5rem;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box; /* 確保 padding 不會影響寬度 */
            font-family: inherit;
        }

        #user-input:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 5px rgba(26, 115, 232, 0.5);
        }

        /* --- 按鈕 --- */
        .controls {
            text-align: center;
            margin-top: 20px;
        }

        #restart-button {
            padding: 12px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            font-weight: 500;
        }

        #restart-button:hover {
            background-color: #185abc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>中文打字練習</h1>

        <div class="stats">
            <div class="stat-item">
                <div class="label">速度 (字/分)</div>
                <div id="cpm" class="value">0</div>
            </div>
            <div class="stat-item">
                <div class="label">準確率 (%)</div>
                <div id="accuracy" class="value">100</div>
            </div>
        </div>

        <div id="text-display"></div>
        
        <!-- 新的即時拆碼提示區 -->
        <div id="code-display" style="font-size: 2rem; font-weight: bold; color: #1a73e8; margin-top: 10px; min-height: 40px; text-align: center; letter-spacing: 3px; background-color: #f8f9fa; padding: 10px; border-radius: 8px;"></div>

        <textarea id="user-input" autofocus style="margin-top: 20px;"></textarea>
        
        <div class="controls">
            <button id="restart-button">重新開始</button>
        </div>
    </div>
    
    <script>
        // --- 應用程式狀態 ---
        let allSentences = [];
        let newcjMap = {};
        let currentSentence = '';
        let sentenceChars = [];
        let startTime = null;
        let intervalId = null;
        let isComposing = false;

        // --- DOM 元素 ---
        const textDisplayEl = document.getElementById('text-display');
        const userInputEl = document.getElementById('user-input');
        const restartButtonEl = document.getElementById('restart-button');
        const cpmEl = document.getElementById('cpm');
        const accuracyEl = document.getElementById('accuracy');
        const codeDisplayEl = document.getElementById('code-display'); // 新的拆碼顯示區

        // --- 函數 ---

        async function initialize() {
            userInputEl.disabled = true;
            restartButtonEl.disabled = true;
            textDisplayEl.textContent = '正在載入資料...';
            codeDisplayEl.textContent = '...';

            try {
                const [corpusResponse, newcjResponse] = await Promise.all([
                    fetch('corpus.json'),
                    fetch('newcj.json')
                ]);

                if (!corpusResponse.ok) throw new Error(`無法載入 corpus.json: ${corpusResponse.statusText}`);
                if (!newcjResponse.ok) throw new Error(`無法載入 newcj.json: ${newcjResponse.statusText}`);

                allSentences = await corpusResponse.json();
                newcjMap = await newcjResponse.json();

                if (!allSentences || allSentences.length === 0) throw new Error('語料庫為空。');
                if (!newcjMap || Object.keys(newcjMap).length === 0) throw new Error('倉頡碼表為空。');
                
                userInputEl.disabled = false;
                restartButtonEl.disabled = false;
                loadNewSentence();

            } catch (error) {
                console.error('初始化失敗:', error);
                textDisplayEl.textContent = `錯誤：${error.message}`;
                codeDisplayEl.textContent = '載入失敗';
            }
        }

        /**
         * 更新拆碼提示
         */
        function updateCodeDisplay(char) {
            if (!char) {
                codeDisplayEl.textContent = '';
                return;
            }
            const codes = newcjMap[char];
            if (codes && codes.length > 0) {
                codeDisplayEl.textContent = codes.join(' ');
            } else {
                codeDisplayEl.textContent = '查無此字';
            }
        }

        function loadNewSentence() {
            if (allSentences.length === 0) return;
            
            if (intervalId) clearInterval(intervalId);
            intervalId = null;
            startTime = null;
            userInputEl.value = '';
            userInputEl.disabled = false;
            userInputEl.focus();
            cpmEl.textContent = '0';
            accuracyEl.textContent = '100';

            const sentenceIndex = Math.floor(Math.random() * allSentences.length);
            currentSentence = allSentences[sentenceIndex];

            textDisplayEl.innerHTML = '';
            sentenceChars = currentSentence.split('').map(char => {
                const span = document.createElement('span');
                span.textContent = char;
                textDisplayEl.appendChild(span);
                return span;
            });

            if (sentenceChars.length > 0) {
                sentenceChars[0].classList.add('current');
                updateCodeDisplay(currentSentence[0]); // 自動顯示第一個字的碼
            } else {
                updateCodeDisplay(null); // 清空拆碼區
            }
        }

        function handleInput() {
            if (isComposing) return;
            if (!startTime) {
                startTime = new Date();
                intervalId = setInterval(updateStats, 1000);
            }
            const userInput = userInputEl.value;
            sentenceChars.forEach((charSpan, index) => {
                const typedChar = userInput[index];
                charSpan.classList.remove('correct', 'incorrect', 'current');
                if (typedChar == null) {
                } else if (typedChar === charSpan.textContent) {
                    charSpan.classList.add('correct');
                } else {
                    charSpan.classList.add('incorrect');
                }
            });

            const nextCharIndex = userInput.length;
            if (nextCharIndex < sentenceChars.length) {
                sentenceChars[nextCharIndex].classList.add('current');
                updateCodeDisplay(currentSentence[nextCharIndex]); // 更新為下一個字的碼
            } else {
                updateCodeDisplay(null); // 完成句子，清空拆碼區
            }

            if (userInput.length === currentSentence.length) {
                updateStats();
                clearInterval(intervalId);
                userInputEl.disabled = true;
            }
        }
        
        function updateStats() {
            if (!startTime) return;
            const currentTime = new Date();
            const elapsedTime = (currentTime - startTime) / 1000;
            const typedCharsCount = userInputEl.value.length;
            if (typedCharsCount === 0) {
                cpmEl.textContent = '0';
                accuracyEl.textContent = '100';
                return;
            }
            let correctCharsCount = 0;
            for(let i = 0; i < typedCharsCount; i++) {
                if(userInputEl.value[i] === currentSentence[i]) {
                    correctCharsCount++;
                }
            }
            const cpm = elapsedTime > 0 ? Math.round((correctCharsCount / elapsedTime) * 60) : 0;
            cpmEl.textContent = cpm;
            const accuracy = Math.round((correctCharsCount / typedCharsCount) * 100);
            accuracyEl.textContent = accuracy;
        }

        // --- 事件監聽 ---
        userInputEl.addEventListener('input', handleInput);
        restartButtonEl.addEventListener('click', loadNewSentence);
        
        userInputEl.addEventListener('compositionstart', () => { isComposing = true; });
        userInputEl.addEventListener('compositionend', () => {
            isComposing = false;
            handleInput();
        });

        // --- 初始載入 ---
        initialize();
    </script>

</body>
</html>
